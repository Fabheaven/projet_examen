security:
  # Configuration des hashers de mot de passe
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  # Configuration des fournisseurs d'utilisateur
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  # Configuration des firewalls
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_user_provider
      custom_authenticator: App\Security\UserAuthenticator
      entry_point: App\Security\UserAuthenticator
      logout:
        path: /logout
        # target: app_any_route # Pour redirection après déconnexion

      remember_me:
        secret: '%kernel.secret%'
        lifetime: 604800
        path: /
        always_remember_me: true

 # Contrôles d'accès
  access_control:
    - { path: ^/admin, roles: ROLE_ADMIN }  # Accès réservé aux admins
    - { path: ^/manager, roles: ROLE_MANAGER }  # Accès réservé aux managers
    - { path: ^/profile, roles: ROLE_USER }  # Accès réservé aux utilisateurs connectés

  # Rôles
  role_hierarchy:
    ROLE_MANAGER: [ROLE_USER]  # ROLE_MANAGER hérite de ROLE_USER
    ROLE_ADMIN: [ROLE_MANAGER]  # ROLE_ADMIN hérite de ROLE_MANAGER

# Services supplémentaires
services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Service JWT (si utilisé)
  App\Service\JWTService:
    arguments:
      $secret: '%env(JWT_SECRET)%'

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
